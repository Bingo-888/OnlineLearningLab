services:
  app:
    build: .
    # 快速部署：docker compose pull && docker compose up -d（拉 ghcr.io 预构建镜像）
    # 本地开发/CI：docker compose up -d --build（两条路共用本文件）
    image: ghcr.io/bingo888-lab/onlinelearninglab:latest
    container_name: oll
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      MAX_UPLOAD_MB: "200"
      # 前面套了 HTTPS 反向代理（如 Caddy/Nginx）后改成 "true"
      COOKIE_SECURE: "false"
    volumes:
      - ./data:/data
    restart: unless-stopped
